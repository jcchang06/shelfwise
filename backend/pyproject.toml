[project]
name = "shelfwise-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, DJ django, S bandit-lite
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]  # asserts and test passwords are fine in tests
"conftest.py" = ["S101"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--reuse-db --cov --cov-report=term-missing:skip-covered"

[tool.coverage.run]
source = ["."]
branch = true
omit = [
  "*/migrations/*",
  "*/tests/*",
  "conftest.py",
  "manage.py",
  "config/asgi.py",
  "config/wsgi.py",
  ".venv/*",
]

[tool.coverage.report]
fail_under = 70
