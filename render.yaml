# Render Blueprint for the Shelfwise API (free plan). Set up steps: README → Deploy.
#
# Free-plan constraints this file works around:
# - No preDeployCommand, shell or one-off jobs, so migrations run in buildCommand (once
#   per deploy; a failed migration fails the deploy) and the first account is created
#   from your machine with createsuperuser against Neon.
# - New services default to Python 3.14, so the version is pinned.
# - The instance sleeps after 15 minutes idle; the first request after that takes ~1 min.

services:
  - type: web
    name: shelfwise-api # live at https://shelfwise-api-et8p.onrender.com (Render added -et8p)
    runtime: python
    plan: free
    region: oregon # same AWS region as the Neon database (us-west-2)
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py dbinfo &&
      python manage.py migrate --noinput &&
      python manage.py createcachetable
    startCommand: >-
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
      --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /api/health/
    autoDeployTrigger: checksPass # deploy main only after CI passes
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.16" # same as local and CI (.python-version)
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: TIME_ZONE
        value: America/Los_Angeles
      # Sign-up stays closed; your account is created with createsuperuser (README).
      # Kept in this file, not the dashboard, so a Blueprint sync can't reopen it.
      - key: ALLOW_SIGNUP
        value: "false"
      # sync: false = Render asks for these once when the Blueprint is created and never
      # overwrites them afterwards. Change them in the dashboard.
      - key: DATABASE_URL
        sync: false # Neon *direct* connection string (not -pooler)
      - key: GOOGLE_BOOKS_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false # http://localhost:5173 until the frontend is deployed

  # Frontend: free static site (served from Render's CDN; it doesn't sleep).
  # No rootDir: staticPublishPath is relative to the repo root, so build in frontend/
  # and publish frontend/dist explicitly.
  - type: web
    name: shelfwise # live at https://shelfwise-nmg7.onrender.com (Render added -nmg7)
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22" # new services default to Node 24; matches .nvmrc and CI
      # Inlined into the bundle at build time. Production builds fail without an
      # https URL (frontend/build/apiBaseUrl.ts).
      - key: VITE_API_BASE_URL
        value: https://shelfwise-api-et8p.onrender.com/api
    routes:
      # Single-page app: client-side routes like /dashboard serve index.html. Render
      # skips the rule when a file exists at the path, so /assets/* is served as-is.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vite content-hashes everything in /assets, so it can be cached forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Scripts only from this site; API calls only to our API; book covers from Google
      # Books and Open Library (whose covers redirect to archive.org). 'unsafe-inline'
      # is for styles only (React style props, Chart.js canvas sizing).
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: https://books.google.com https://*.googleusercontent.com https://covers.openlibrary.org https://archive.org https://*.archive.org;
          connect-src 'self' https://shelfwise-api-et8p.onrender.com;
          font-src 'self';
          object-src 'none';
          base-uri 'self';
          form-action 'self';
          frame-ancestors 'none'
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: max-age=86400
