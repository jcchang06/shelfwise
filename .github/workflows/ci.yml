name: CI

# Pushes to main (merges) and PRs into main. Feature branches run once via their PR,
# not twice (push + pull_request), which halves Actions minutes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch to save Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Same Postgres major version as docker-compose; tests run against real Postgres, not SQLite.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shelfwise
          POSTGRES_PASSWORD: shelfwise
          POSTGRES_DB: shelfwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shelfwise"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgres://shelfwise:shelfwise@localhost:5432/shelfwise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run # fail if a model change has no migration
      - run: pytest --create-db
      # Production-like settings must pass Django's deployment checklist. Fails on any
      # warning except the two silenced on purpose in settings.py.
      - name: Django deploy checks
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-deploy-check-${{ github.run_id }}-not-a-real-secret-0123456789abcdef
          RENDER_EXTERNAL_HOSTNAME: shelfwise-api-et8p.onrender.com

  frontend:
    name: Frontend (eslint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # Production builds fail without an https API URL (frontend/build/apiBaseUrl.ts).
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://shelfwise-api-et8p.onrender.com/api
