name: Nightly jobs

# Production has no always-on worker (free Render), so scheduled work runs here as plain
# Django management commands against the production database (Neon).
# Setup: README → Deploy → "Nightly jobs" (two repository secrets).
on:
  schedule:
    - cron: "0 10 * * *" # 02:00 PST / 03:00 PDT (GitHub cron runs in UTC)
  workflow_dispatch: # "Run workflow" button, for testing or catching up

permissions:
  contents: read

# Never run two copies against the same database at once.
concurrency:
  group: jobs-nightly
  cancel-in-progress: false

jobs:
  imports:
    name: Finish Goodreads imports
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
      # The commands sign nothing, so a per-run value is fine (settings require one).
      DJANGO_SECRET_KEY: nightly-job-${{ github.run_id }}-${{ github.run_attempt }}
      DJANGO_DEBUG: "false"
      TIME_ZONE: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4
      - name: Check the repository secrets are set
        run: |
          missing=""
          [ -n "$DATABASE_URL" ] || missing="$missing DATABASE_URL"
          [ -n "$GOOGLE_BOOKS_API_KEY" ] || missing="$missing GOOGLE_BOOKS_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (README → Deploy → Nightly jobs)"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Show which database this is (host only, never the password)
        run: python manage.py dbinfo
      - name: Finish or resume unfinished imports
        run: python manage.py run_pending_imports --max-minutes 20
